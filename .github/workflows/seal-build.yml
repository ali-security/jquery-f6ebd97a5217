name: seal-build

# Build-and-pack only: jQuery 2.2.3's tests run on Travis (.travis.yml).
# Reproduces the npm tarball published for jquery 2.2.3. That tarball is the
# jquery-dist repo (https://github.com/jquery/jquery-dist) tag 2.2.3 tree,
# produced by build/release/dist.js: the previous jquery-dist master commit
# (3a43d7e5, "Release 1.12.3") with this release's files copied on top.
on:
  workflow_dispatch: {}

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # jquery-dist accumulates stale files (dist/jquery.slim.* from
      # 3.0.0-beta1, old src/ files) and all of them ship in the tarball, so
      # start from the exact jquery-dist commit release 2.2.3 was built on.
      - name: Fetch jquery-dist base tree (Release 1.12.3)
        run: |
          git clone -q https://github.com/jquery/jquery-dist.git "$RUNNER_TEMP/jqdist"
          git -C "$RUNNER_TEMP/jqdist" checkout -q 3a43d7e563314bf32970b773dd31ecf2b90813dd
          git -C "$RUNNER_TEMP/jqdist" log --oneline -1
          rm -rf "$RUNNER_TEMP/jqdist/.git"

      - name: Write build script
        run: |
          mkdir -p "$RUNNER_TEMP/seal"
          cat > "$RUNNER_TEMP/seal/build.sh" <<'SEAL_EOF'
          #!/bin/bash
          set -euo pipefail

          # build/tasks/build.js appends $COMMIT to the embedded version string.
          unset COMMIT

          node -v
          npm -v

          # Registry time machine at the 2.2.3 release date.
          npm config set registry https://:2016-04-05T19%3A27%3A17.929Z@time-machines-npm.sealsecurity.io/
          npm install

          # Pin the @DATE stamp embedded in dist/jquery.js to the release build
          # time (done here, not as a source edit: build/ is not patchable).
          sed -i 's|( new Date() ).toISOString().replace( /:\\d+\\.\\d+Z$/, "Z" )|"2016-04-05T19:26Z"|' build/tasks/build.js
          grep -q '"2016-04-05T19:26Z"' build/tasks/build.js

          # build:*:* + lint + uglify + remove_map_comment + dist:*
          ./node_modules/.bin/grunt dev

          echo "Built dist checksums:"
          sha1sum dist/jquery.js dist/jquery.min.js dist/jquery.min.map

          # Assemble the jquery-dist tree as build/release/dist.js does.
          mkdir -p /jqdist/dist
          cp -f dist/jquery.js dist/jquery.min.js dist/jquery.min.map /jqdist/dist/
          cp -rf src /jqdist/
          mkdir -p /jqdist/sizzle
          cp -rf external/sizzle/. /jqdist/sizzle/
          cp -f LICENSE.txt AUTHORS.txt package.json /jqdist/
          # Same shape as generateBower() in build/release/dist.js (no trailing newline).
          node -e 'var fs=require("fs"),pkg=require("/work/package.json");fs.writeFileSync("/jqdist/bower.json",JSON.stringify({name:pkg.name,main:pkg.main,license:"MIT",ignore:["package.json"],keywords:pkg.keywords},null,2));'

          chown -R "$HOST_UID:$HOST_GID" /jqdist
          cd /jqdist
          npm pack
          mkdir -p /work/seal-out
          cp jquery-2.2.3.tgz /work/seal-out/
          tar tzvf /work/seal-out/jquery-2.2.3.tgz
          sha1sum /work/seal-out/jquery-2.2.3.tgz
          chown -R "$HOST_UID:$HOST_GID" /work/seal-out /work/dist
          SEAL_EOF
          cat "$RUNNER_TEMP/seal/build.sh"

      # The public tarball was packed with Node 5.8.0 / npm 3.7.3.
      - name: Build and pack in node:5
        run: |
          docker run --rm -e HOST_UID=$(id -u) -e HOST_GID=$(id -g) \
            -v "$GITHUB_WORKSPACE":/work -v "$RUNNER_TEMP/seal":/seal \
            -v "$RUNNER_TEMP/jqdist":/jqdist \
            -w /work node:5 bash /seal/build.sh

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: jquery-2.2.3
          path: seal-out/jquery-2.2.3.tgz
          if-no-files-found: error
